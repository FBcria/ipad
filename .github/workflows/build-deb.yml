name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-linux-v4

      - name: Dependências
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          PACOTES="libxml2 libxml2-dev libtinfo6 dpkg-dev make curl git jq clang lld pkg-config libplist-dev zip"
          APT="sudo apt-get -o Acquire::Retries=2 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for i in 1 2; do
            timeout 120 $APT update || true
            if timeout 150 $APT install -y $PACOTES; then
              echo "dependencias ok"
              exit 0
            fi
            echo "tentativa $i falhou"
            sleep 8
          done
          echo "::warning::dependencias incompletas, seguindo"

      - name: Instalar Theos
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          export THEOS=$HOME/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true

      - name: Definir THEOS
        run: echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Conferir toolchain
        run: |
          set -e
          test -d "$THEOS/makefiles" || { echo "theos ausente"; exit 1; }
          test -d "$THEOS/sdks" || { echo "sdks ausentes"; exit 1; }
          command -v clang >/dev/null || { echo "clang ausente"; exit 1; }
          command -v zip >/dev/null || sudo apt-get install -y zip

      - name: Localizar Makefile
        id: mk
        run: |
          set -e
          ls -la
          if [ -f BallKey/Makefile ]; then
            echo "dir=BallKey" >> $GITHUB_OUTPUT
          elif [ -f Makefile ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          else
            echo "Makefile nao encontrado"
            find . -maxdepth 3 -name Makefile -print
            exit 1
          fi

      - name: Versão do control
        id: ver
        run: |
          set -e
          C="${{ steps.mk.outputs.dir }}/control"
          V=$(grep -m1 '^Version:' "$C" | awk '{print $2}')
          test -n "$V" || { echo "Version ausente no control"; exit 1; }
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          set -e
          make -C "${{ steps.mk.outputs.dir }}" clean
          make -C "${{ steps.mk.outputs.dir }}" package FINALPACKAGE=1
          
      - name: Conferir layout do pacote
        run: |
          set -e
          DEB=$(ls "${{ steps.mk.outputs.dir }}"/packages/*.deb | head -1)
          test -n "$DEB" || { echo "deb nao gerado"; exit 1; }
          echo "pacote: $DEB"
          dpkg-deb -f "$DEB" Architecture
          LIST=$(dpkg-deb -c "$DEB" | awk '{print $NF}')
          echo "$LIST" | head -30
          if echo "$LIST" | grep -qE '(^|/)(var/jb|rootfs)/'; then
            echo "pacote nao esta rootful (var/jb ou rootfs presente)"; exit 1
          fi
          echo "$LIST" | grep -qE '^\.?/?Library/MobileSubstrate/DynamicLibraries/' \
            || { echo "dylib fora de Library/MobileSubstrate"; exit 1; }
          echo "layout rootful ok"

      - name: Build app instalador
        run: |
          set -e
          test -f BallKeyApp/Makefile || { echo "BallKeyApp ausente"; exit 1; }
          make -C BallKeyApp clean
          make -C BallKeyApp FINALPACKAGE=1

      - name: Empacotar tipa
        run: |
          set -e
          BIN=$(find BallKeyApp/.theos/obj -maxdepth 4 -type f -name "BallKeyApp" | head -1)
          test -n "$BIN" || { echo "binario nao gerado"; find BallKeyApp/.theos -maxdepth 6; exit 1; }
          DEB=$(ls "${{ steps.mk.outputs.dir }}"/packages/*.deb | head -1)
          test -n "$DEB" || { echo "deb nao encontrado"; exit 1; }

          rm -rf Payload
          mkdir -p Payload/BallKeyApp.app
          cp "$BIN" Payload/BallKeyApp.app/BallKeyApp
          cp BallKeyApp/Info.plist Payload/BallKeyApp.app/Info.plist
          cp "$DEB" Payload/BallKeyApp.app/
          chmod +x Payload/BallKeyApp.app/BallKeyApp

          test -f Payload/BallKeyApp.app/Info.plist || { echo "Info.plist ausente"; exit 1; }
          test -f Payload/BallKeyApp.app/$(basename "$DEB") || { echo "deb ausente no bundle"; exit 1; }

          if [ -x "$THEOS/bin/ldid" ]; then
            "$THEOS/bin/ldid" -SBallKeyApp/entitlements.plist Payload/BallKeyApp.app/BallKeyApp
          fi

          zip -qr "BallKey-${{ steps.ver.outputs.version }}.tipa" Payload
          rm -rf Payload
          unzip -l "BallKey-${{ steps.ver.outputs.version }}.tipa"

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ballkey-${{ steps.ver.outputs.version }}-${{ github.run_number }}
          path: |
            ${{ steps.mk.outputs.dir }}/packages/*.deb
            *.tipa
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: BallKey v${{ steps.ver.outputs.version }} (${{ github.run_number }})
          files: |
            ${{ steps.mk.outputs.dir }}/packages/*.deb
            *.tipa

      - name: Podar releases antigas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[15:] | .[].tagName' \
          | while read -r t; do
              echo "apagando $t"
              gh release delete "$t" --yes --cleanup-tag
            done

      - name: Resumo
        if: always()
        run: |
          {
            echo "### BallKey"
            echo "- Versao: ${{ steps.ver.outputs.version }}"
            echo "- Run: ${{ github.run_number }}"
            echo "- Status: ${{ job.status }}"
          } >> $GITHUB_STEP_SUMMARY
