name: build-deb

on:
  push:
    branches: [main]
    paths:
      - 'BallKey/**'
      - '.github/workflows/build-deb.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deb
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos + iOS SDK
        run: |
          set -euo pipefail
          brew install ldid dpkg xz
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          ( cd "$RUNNER_TEMP/sdks" && git sparse-checkout set iPhoneOS16.5.sdk )
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          test -d "$HOME/theos/vendor/mod/roothide"

      - name: Normalize sources (UTF-8, sem BOM)
        run: |
          set -euo pipefail
          for f in $(git ls-files 'BallKey/*.x' 'BallKey/*.h' 'BallKey/*.m'); do
            perl -i -pe 's/^\xEF\xBB\xBF//' "$f"
            if ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then
              tmp="$(mktemp)"
              iconv -f GB18030 -t UTF-8 "$f" > "$tmp"
              cp "$tmp" "$f"
              rm -f "$tmp"
              echo "converted from GBK: $f"
            fi
          done

      - name: Build BallKey
        run: |
          set -o pipefail
          cd BallKey
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: BallKey/build.log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BallKey build
          files: BallKey/packages/*.deb
          make_latest: true
