name: build-deb

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependências
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git \
            libxml2 libxml2-dev libtinfo6 dpkg-dev

      - name: Instalar Theos
        run: |
          set -e
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Aplicar fork RootHide
        run: |
          set -e
          cd "$THEOS"
          git remote set-url origin https://github.com/roothide/theos.git
          git fetch --depth 1 origin master
          git reset --hard FETCH_HEAD
          git submodule update --init --recursive || true
          if ! grep -rq "roothide" makefiles/; then
            echo "fork do RootHide não foi aplicado"
            exit 1
          fi
          echo "esquemas disponíveis:"
          ls makefiles/package/ 2>/dev/null || true

      - name: Conferir toolchain
        run: |
          set -e
          test -x "$THEOS/toolchain/linux/iphone/bin/clang" || { echo "toolchain ausente"; exit 1; }
          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          ls "$THEOS/sdks" | head

      - name: Versão
        id: ver
        working-directory: BallKey
        run: |
          V=$(grep -m1 '^Version:' control | awk '{print $2}')
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "Versão: $V"

      - name: Build
        working-directory: BallKey
        run: |
          set -e
          make clean || true
          make package FINALPACKAGE=1 ARCHS=arm64
          ls -la packages/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ballkey-${{ github.run_number }}
          path: BallKey/packages/*.deb
          retention-days: 14
          if-no-files-found: error

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v${{ steps.ver.outputs.v }}-${{ github.run_number }}"
          gh release create "$TAG" BallKey/packages/*.deb \
            --title "BallKey ${{ steps.ver.outputs.v }} (${{ github.run_number }})" \
            --notes "Build ${{ github.run_number }}"
          gh release list --limit 50 --json tagName -q '.[].tagName' \
            | tail -n +16 \
            | xargs -r -n1 gh release delete -y --cleanup-tag

      - name: Resumo
        if: always()
        run: |
          echo "### BallKey ${{ steps.ver.outputs.v }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run ${{ github.run_number }} — ubuntu-24.04" >> "$GITHUB_STEP_SUMMARY"
