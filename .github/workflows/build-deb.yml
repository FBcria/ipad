name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2 libxml2-dev libtinfo6 dpkg-dev make curl git jq

      - name: Instalar Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Aplicar fork RootHide
        run: |
          set -e
          git -C "$THEOS" remote set-url origin https://github.com/roothide/theos.git
          git -C "$THEOS" fetch --depth 1 origin master
          git -C "$THEOS" reset --hard FETCH_HEAD
          grep -rq roothide "$THEOS/makefiles/" || { echo "fork nao aplicado"; exit 1; }

      - name: Conferir toolchain
        run: |
          set -e
          test -d "$THEOS/toolchain/linux/iphone" || { echo "toolchain ausente"; exit 1; }
          test -d "$THEOS/sdks" || { echo "sdks ausentes"; exit 1; }

      - name: Localizar Makefile
        id: mk
        run: |
          set -e
          ls -la
          if [ -f BallKey/Makefile ]; then
            echo "dir=BallKey" >> $GITHUB_OUTPUT
          elif [ -f Makefile ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          else
            echo "Makefile nao encontrado"
            find . -maxdepth 3 -name Makefile -print
            exit 1
          fi

      - name: Versão do control
        id: ver
        run: |
          set -e
          C="${{ steps.mk.outputs.dir }}/control"
          V=$(grep -m1 '^Version:' "$C" | awk '{print $2}')
          test -n "$V" || { echo "Version ausente no control"; exit 1; }
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          set -e
          make -C "${{ steps.mk.outputs.dir }}" clean
          make -C "${{ steps.mk.outputs.dir }}" package FINALPACKAGE=1

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ballkey-${{ steps.ver.outputs.version }}-${{ github.run_number }}
          path: ${{ steps.mk.outputs.dir }}/packages/*.deb
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: BallKey v${{ steps.ver.outputs.version }} (${{ github.run_number }})
          files: ${{ steps.mk.outputs.dir }}/packages/*.deb

      - name: Podar releases antigas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[15:] | .[].tagName' \
          | while read -r t; do
              echo "apagando $t"
              gh release delete "$t" --yes --cleanup-tag
            done

      - name: Resumo
        if: always()
        run: |
          {
            echo "### BallKey"
            echo "- Versao: ${{ steps.ver.outputs.version }}"
            echo "- Run: ${{ github.run_number }}"
            echo "- Diretorio: ${{ steps.mk.outputs.dir }}"
            echo "- Status: ${{ job.status }}"
          } >> $GITHUB_STEP_SUMMARY
