name: build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Compilar
        run: |
          set -e
          cd BallKey
          make clean
          make FINALPACKAGE=1
          find .theos -name '*.dylib' -exec ls -lh {} \;

      - name: Preparar dylib
        run: |
          set -e
          TOOL="$THEOS/toolchain/linux/iphone/bin"
          DYLIB=$(find BallKey/.theos -name 'NativeInput.dylib' | head -n 1)
          [ -n "$DYLIB" ] || { echo "::error::dylib nao gerada"; find BallKey/.theos -type f | head -n 60; exit 1; }
          cp "$DYLIB" ./libNativeInput.dylib
          "$TOOL/llvm-strip" -x ./libNativeInput.dylib || true
          "$TOOL/ldid" -S ./libNativeInput.dylib
          "$TOOL/llvm-objdump" -p ./libNativeInput.dylib | grep -E 'LC_ID_DYLIB|name @rpath'
          "$TOOL/llvm-objdump" -p ./libNativeInput.dylib | grep -E 'cmd LC_LOAD_DYLIB' -A2
          file ./libNativeInput.dylib

      - name: Publicar
        run: |
          set -e
          gh release delete dylib --yes --cleanup-tag || true
          gh release create dylib ./libNativeInput.dylib -t "build $(date -u +%FT%TZ)" -n "libNativeInput.dylib"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: libNativeInput
          path: libNativeInput.dylib
