name: build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Compilar
        run: |
          set -e
          cd BallKey
          make clean
          make FINALPACKAGE=1
          find .theos -name '*.dylib' -exec ls -lh {} \;

      - name: Preparar dylib
        run: |
          set -e
          DYLIB=$(find BallKey/.theos -name 'NativeInput.dylib' | head -n 1)
          [ -n "$DYLIB" ] || { echo "::error::dylib nao gerada"; find BallKey/.theos -type f | head -n 60; exit 1; }
          cp "$DYLIB" ./libNativeInput.dylib

          LDID=$(command -v ldid 2>/dev/null || true)
          if [ -z "$LDID" ]; then
            LDID=$(find "$THEOS" -type f -name ldid 2>/dev/null | head -n 1)
          fi
          if [ -n "$LDID" ]; then
            "$LDID" -S ./libNativeInput.dylib && echo "assinado com $LDID"
          else
            echo "aviso: ldid nao encontrado, seguindo sem assinatura"
          fi

          STRIP=$(command -v llvm-strip 2>/dev/null || true)
          if [ -z "$STRIP" ]; then
            STRIP=$(find "$THEOS" -type f -name 'llvm-strip' 2>/dev/null | head -n 1)
          fi
          if [ -n "$STRIP" ]; then
            "$STRIP" -x ./libNativeInput.dylib && echo "stripped com $STRIP"
          else
            echo "aviso: sem strip (o link ja usa -Wl,-x)"
          fi

          echo "--- tipo ---"
          file ./libNativeInput.dylib
          echo "--- instal name / dependencias ---"
          grep -a -o -E '@rpath/[A-Za-z0-9._-]+' ./libNativeInput.dylib | sort -u
          grep -a -o -E '/usr/lib/[A-Za-z0-9._-]+' ./libNativeInput.dylib | sort -u
          grep -a -o -E '/System/Library/Frameworks/[A-Za-z0-9._-]+' ./libNativeInput.dylib | sort -u

      - name: Publicar
        run: |
          set -e
          gh release delete dylib --yes --cleanup-tag || true
          gh release create dylib ./libNativeInput.dylib -t "build $(date -u +%FT%TZ)" -n "libNativeInput.dylib"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: libNativeInput
          path: libNativeInput.dylib
