name: build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Compilar e empacotar
        run: |
          set -e
          cd BallKey
          make clean
          make package FINALPACKAGE=1

      - name: Conferir deb
        run: |
          set -e
          DEB=$(ls BallKey/packages/*.deb 2>/dev/null | head -n 1)
          [ -n "$DEB" ] || { echo "::error::deb nao gerado"; find BallKey -type f | head -n 80; exit 1; }
          ls -lh "$DEB"
          echo "--- conteudo ---"
          dpkg-deb -c "$DEB"
          echo "--- controle ---"
          dpkg-deb -I "$DEB"

      - name: Publicar
        run: |
          set -e
          DEB=$(ls BallKey/packages/*.deb | head -n 1)
          gh release delete deb --yes --cleanup-tag || true
          gh release create deb "$DEB" -t "build $(date -u +%FT%TZ)" -n "MobileInput deb"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: MobileInput-deb
          path: BallKey/packages/*.deb
