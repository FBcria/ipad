name: dylib
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Compilar
        run: |
          set -e
          cd BallKey
          make clean
          make FINALPACKAGE=1
          find .theos -type f -name '*.dylib' -exec ls -lh {} \;

      - name: Assinar
        run: |
          set -e

          DYLIB=$(find BallKey/.theos -type f -name '*.dylib' | head -n 1)
          if [ -z "$DYLIB" ]; then
            echo "::error::nenhum dylib foi gerado"
            find BallKey/.theos -type f | head -n 80
            exit 1
          fi
          echo "dylib gerado em: $DYLIB"
          cp "$DYLIB" ./libballkey.dylib

          LDID=""
          for c in "${THEOS:-}/bin/ldid" "$(command -v ldid || true)" /opt/homebrew/bin/ldid /usr/local/bin/ldid; do
            if [ -n "$c" ] && [ -x "$c" ]; then LDID="$c"; break; fi
          done
          if [ -z "$LDID" ]; then
            echo "ldid nao encontrado, tentando instalar"
            brew install ldid >/dev/null 2>&1 || true
            LDID="$(command -v ldid || true)"
          fi

          if [ -n "$LDID" ]; then
            echo "assinando com $LDID"
            "$LDID" -S ./libballkey.dylib
          else
            echo "::warning::ldid indisponivel, usando codesign ad-hoc"
            codesign -s - -f ./libballkey.dylib
          fi

          ls -lh ./libballkey.dylib
          file ./libballkey.dylib
          codesign -dv ./libballkey.dylib 2>&1 || true

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: libballkey
          path: libballkey.dylib

      - name: Publicar release
        run: |
          set -e
          gh release delete dylib --yes --cleanup-tag || true
          gh release create dylib ./libballkey.dylib -t "dylib" -n "build $(date -u +%FT%TZ)"
          gh release view dylib --json assets -q '.assets[].name'
        env:
          GH_TOKEN: ${{ github.token }}
