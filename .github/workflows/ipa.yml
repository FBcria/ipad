name: ipa
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = painel | empty = dylib vazia'
        type: choice
        options: [full, empty]
        default: full
      ent:
        description: 'Aplicar entitlements HID'
        type: boolean
        default: false

jobs:
  ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Baixar IPA base
        run: |
          set -e
          gh release download ipa --pattern '*.ipa' --dir .
          ls -lh *.ipa
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compilar dylib
        run: |
          set -e
          SRC=Tweak.m
          [ "${{ inputs.mode }}" = "empty" ] && SRC=Test.m
          echo "fonte: $SRC"
          cd BallKey
          if [ ! -f Inject.mk ]; then
            cat > Inject.mk <<'MK'
          TARGET := iphone:clang:16.5:14.0
          ARCHS := arm64

          include $(THEOS)/makefiles/common.mk

          LIBRARY_NAME = MobileInput
          MobileInput_FILES = Tweak.m
          MobileInput_CFLAGS = -fobjc-arc -Wno-error=unguarded-availability-new -Wno-error=objc-method-access -Wno-error=int-conversion
          MobileInput_FRAMEWORKS = UIKit GameController IOKit CoreFoundation
          MobileInput_LDFLAGS = -Wl,-install_name,@executable_path/Frameworks/libMobileInput.dylib -Wl,-rpath,@executable_path/Frameworks
          include $(THEOS)/makefiles/library.mk
          MK
          fi
          rm -rf .theos
          make -f Inject.mk clean || true
          make -f Inject.mk MobileInput_FILES=$SRC
          DYLIB=$(find .theos -name 'MobileInput.dylib' | head -n 1)
          [ -n "$DYLIB" ] || { echo "::error::dylib nao gerada"; find .theos -type f | head -n 60; exit 1; }
          cp "$DYLIB" ../libMobileInput.dylib
          ls -lh ../libMobileInput.dylib
          python3 ../tools/deps.py ../libMobileInput.dylib

      - name: Injetar
        run: |
          set -e
          IPA=$(ls *.ipa | head -n 1)
          rm -rf work && mkdir work && cd work
          unzip -q "../$IPA"
          APP=$(ls -d Payload/*.app | head -n 1)
          [ -n "$APP" ] || { echo "::error::Payload vazio"; exit 1; }
          BIN=$(basename "$APP" .app)
          [ -f "$APP/$BIN" ] || { echo "::error::executavel $BIN nao encontrado"; exit 1; }
          mkdir -p "$APP/Frameworks"
          cp ../libMobileInput.dylib "$APP/Frameworks/libMobileInput.dylib"
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          python3 ../tools/inject.py "$APP/$BIN" "@executable_path/Frameworks/libMobileInput.dylib"

          echo "--- load commands do binario ---"
          python3 - "$APP/$BIN" <<'PY'
          import sys, struct
          d = open(sys.argv[1], 'rb').read()
          n = struct.unpack_from('<I', d, 16)[0]
          off, found = 32, 0
          for _ in range(n):
              cmd, csz = struct.unpack_from('<II', d, off)
              if cmd in (0xC, 0xD):
                  so = struct.unpack_from('<I', d, off + 8)[0]
                  print("LOAD:", d[off + so:off + csz].split(b'\0')[0].decode(errors='replace'))
                  found += 1
              off += csz
          if not found:
              sys.exit("nenhum LC_LOAD_DYLIB")
          PY
          test -f "$APP/Frameworks/libMobileInput.dylib"
          echo "arquivo presente"
          zip -qr ../FreeFire_patched.ipa Payload
          cd ..
          ls -lh FreeFire_patched.ipa

      - name: Assinar
        if: ${{ inputs.ent }}
        run: |
          set -e
          LDID=$(command -v ldid 2>/dev/null || true)
          if [ -z "$LDID" ]; then LDID=$(find "$THEOS" -type f -name ldid 2>/dev/null | head -n 1); fi
          [ -n "$LDID" ] || { echo "::error::ldid nao encontrado"; exit 1; }
          cd work
          APP=$(ls -d Payload/*.app | head -n 1)
          BIN=$(basename "$APP" .app)
          "$LDID" -e "$APP/$BIN" > orig.plist 2>/dev/null || true
          python3 ../tools/ent.py orig.plist ../BallKey/ent.plist merged.plist
          "$LDID" -S../BallKey/ent.plist "$APP/Frameworks/libMobileInput.dylib"
          "$LDID" -Smerged.plist "$APP/$BIN"
          rm -f ../FreeFire_patched.ipa
          zip -qr ../FreeFire_patched.ipa Payload
          echo "assinado"

      - name: Publicar IPA
        run: |
          set -e
          TAG="patched-${{ inputs.mode }}"
          [ "${{ inputs.ent }}" = "true" ] && TAG="$TAG-ent"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" ./FreeFire_patched.ipa -t "$TAG $(date -u +%FT%TZ)" -n "FreeFire + MobileInput"
        env:
          GH_TOKEN: ${{ github.token }}
