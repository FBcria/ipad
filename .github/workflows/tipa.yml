name: tipa
on: [ workflow_dispatch ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'
      - name: Compilar app
        run: |
          cd Injector
          make clean
          make FINALPACKAGE=1
      - name: Empacotar tipa
        run: |
          rm -rf Payload BallKey.tipa
          mkdir -p Payload
          cp -R Injector/.theos/_/Applications/BallKeyInjector.app Payload/
          "$THEOS/bin/ldid" -SInjector/entitlements.plist Payload/BallKeyInjector.app/BallKeyInjector
          zip -qr BallKey.tipa Payload
          ls -lh BallKey.tipa
      - uses: actions/upload-artifact@v4
        with:
          name: BallKey-tipa
          path: BallKey.tipa
