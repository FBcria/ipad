name: tipa
on: [ workflow_dispatch ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Compilar app
        run: |
          set -e
          cd Injector
          make clean
          make FINALPACKAGE=1
          find .theos -name '*.app' -maxdepth 6

      - name: Empacotar e assinar
        run: |
          set -e

          APP=$(find Injector/.theos -type d -name '*.app' | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::app nao gerado"
            find Injector/.theos -type f | head -n 80
            exit 1
          fi
          echo "app gerado em: $APP"

          rm -rf Payload BallKey.tipa
          mkdir -p Payload
          cp -R "$APP" Payload/

          LDID=""
          for c in "${THEOS:-}/bin/ldid" "$(command -v ldid || true)" /opt/homebrew/bin/ldid /usr/local/bin/ldid; do
            if [ -n "$c" ] && [ -x "$c" ]; then LDID="$c"; break; fi
          done
          if [ -z "$LDID" ]; then
            brew install ldid >/dev/null 2>&1 || true
            LDID="$(command -v ldid || true)"
          fi

          BIN="Payload/$(basename "$APP")/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "Payload/$(basename "$APP")/Info.plist")"
          echo "binario: $BIN"

          if [ -n "$LDID" ]; then
            "$LDID" -SInjector/entitlements.plist "$BIN"
          else
            codesign -s - -f --entitlements Injector/entitlements.plist "$BIN"
          fi

          zip -qr BallKey.tipa Payload
          unzip -l BallKey.tipa
          ls -lh BallKey.tipa

      - uses: actions/upload-artifact@v4
        with:
          name: BallKey-tipa
          path: BallKey.tipa
